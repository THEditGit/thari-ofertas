name: Buscar ofertas do Telegram

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: sync-ofertas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler o grupo e atualizar products.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/sync_telegram.py
      - name: Salvar mudanças
        run: |
          if [ -n "$(git status --porcelain products.json images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products.json images
            git commit -m "Atualiza ofertas do Telegram"
            git push
          else
            echo "Nenhuma oferta nova."
          fi

name: Montar ofertas do site

on:
  push:
    branches: [dados]
    paths: ["offers/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-ofertas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Juntar ofertas em products.json
        run: python3 site/scripts/build_products.py dados/offers site/products.json
      - name: Salvar no site
        working-directory: site
        run: |
          if [ -n "$(git status --porcelain products.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products.json
            git commit -m "Monta ofertas do site"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nada novo."
          fi
